# The same checks CI runs: most before each commit, Vale before each push.
# Set up once, inside `nix develop`, which provides every tool these need:
#   pre-commit install
# Run everything by hand with:
#   pre-commit run --all-files
#   pre-commit run --all-files --hook-stage pre-push
#
# Revisions are pinned to commit SHAs, matching .github/workflows/ci.yml.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: c01a1853c19b175aee6a09f24e2ad9b748c485ad # frozen: v0.24.1
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: 99470f5e12208ff0fb17ab81c3c494f7620a1d8d # frozen: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: validate-skills
        name: Validate skills
        entry: .github/scripts/validate-skills.sh
        language: golang
        additional_dependencies:
          - github.com/agent-ecosystem/skill-validator/cmd/skill-validator@v1.6.2
        files: ^(skills/|\.github/scripts/validate-skills\.sh$)
        pass_filenames: false

      - id: scan-skills
        name: Scan skills (SkillSpector, static)
        entry: .github/scripts/scan-skills.sh
        language: system
        files: ^(skills/|\.github/skillspector/|\.github/scripts/scan-skills\.sh$)
        pass_filenames: false

      - id: test-scripts
        name: Test .github/scripts (bats)
        entry: bats .github/scripts/tests/
        language: node
        additional_dependencies: [bats@1.13.0]
        files: ^\.github/scripts/
        pass_filenames: false

      - id: check-shell-blocks
        name: Check shell blocks in Markdown
        entry: .github/scripts/check-shell-blocks.py
        language: python
        additional_dependencies: [shellcheck-py==0.11.0.1]
        types: [markdown]

      - id: check-prose
        name: Check prose (Vale)
        entry: .github/scripts/check-prose.sh
        language: system
        files: ^(.*\.md|\.vale\.ini|\.vale/.*|nix/vale\.nix|flake\.(nix|lock)|skills/technical-writing/assets/vale/.*|\.github/scripts/check-prose\.sh)$
        pass_filenames: false
        stages: [pre-push]

      - id: check-versions
        name: Check versions and changelog
        entry: python3 .github/scripts/check-versions.py
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        files: ^(skills/|VERSION$|CHANGELOG\.md$|\.github/scripts/check-versions\.py$)
        pass_filenames: false

      - id: test-versions
        name: Test versions and publishing
        entry: python3 -m unittest discover -s .github/scripts/tests -p test_*.py
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        files: ^\.github/scripts/
        pass_filenames: false
