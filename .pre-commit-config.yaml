# The same checks CI runs, before each commit. Set up once with:
#   pre-commit install
# Needs uv, jq and shellcheck on PATH, and Go, which pre-commit uses to
# build skill-validator.
# Run everything by hand with: pre-commit run --all-files
#
# Revisions are pinned to commit SHAs, matching .github/workflows/ci.yml.
repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10 # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: 99470f5e12208ff0fb17ab81c3c494f7620a1d8d # frozen: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: validate-skills
        name: Validate skills
        entry: .github/scripts/validate-skills.sh
        language: golang
        additional_dependencies:
          - github.com/agent-ecosystem/skill-validator/cmd/skill-validator@v1.6.2
        files: ^(skills/|\.github/scripts/validate-skills\.sh$)
        pass_filenames: false

      - id: scan-skills
        name: Scan skills (SkillSpector, static)
        entry: .github/scripts/scan-skills.sh
        language: system
        files: ^(skills/|\.github/skillspector/|\.github/scripts/scan-skills\.sh$)
        pass_filenames: false

      - id: test-scripts
        name: Test .github/scripts (bats)
        entry: bats .github/scripts/tests/
        language: node
        additional_dependencies: [bats@1.13.0]
        files: ^\.github/scripts/
        pass_filenames: false

      - id: check-shell-blocks
        name: Check shell blocks in Markdown
        entry: .github/scripts/check-shell-blocks.py
        language: python
        additional_dependencies: [shellcheck-py==0.11.0.1]
        types: [markdown]
