# Prose checks for this repository's Markdown. Run them with
# .github/scripts/check-prose.sh, which pre-commit runs before push and CI
# runs on every pull request. Errors fail; warnings and suggestions are
# advice to judge, not orders.
#
# StylesPath comes from the Nix wrapper (nix/vale.nix), which bundles the
# styles below with .vale/styles and an en_GB dictionary.
MinAlertLevel = suggestion
Vocab = Generic, Skills

[*.md]
BasedOnStyles = Vale, Skills, write-good, proselint

# Superseded by Skills.Spelling (en_GB)
Vale.Spelling = NO
# Flags every "is" and "are": noise, not advice
write-good.E-Prime = NO
# US-centric; flags British forms as inconsistent
proselint.Spelling = NO
# Style heuristics, not mistakes: report them without failing
write-good.ThereIs = warning
write-good.So = warning
proselint.Uncomparables = warning
