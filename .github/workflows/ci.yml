# Static checks for every pull request; none call a model (see
# docs/decisions/0002-static-checks-in-ci.md). Job names are required status
# checks in the "Protect main" ruleset, so keep them stable.
#
# No `on: paths:` filters: a required check that never runs blocks the PR.
# The skill checks live in .github/scripts/ so pre-commit runs the same ones.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skills:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install skill-validator
        working-directory: ${{ runner.temp }}
        env:
          SKILL_VALIDATOR_VERSION: 1.6.2
        run: |
          base="https://github.com/agent-ecosystem/skill-validator/releases/download/v${SKILL_VALIDATOR_VERSION}"
          tarball="skill-validator_${SKILL_VALIDATOR_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/skill-validator_${SKILL_VALIDATOR_VERSION}_checksums.txt"
          grep " $tarball\$" "skill-validator_${SKILL_VALIDATOR_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$tarball" skill-validator
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate skills (spec, links, token budgets, unreferenced files)
        run: .github/scripts/validate-skills.sh

  scan:
    name: Scan skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Scan skills with SkillSpector (static, no model)
        run: .github/scripts/scan-skills.sh

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  shell:
    name: Check shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show shellcheck version
        run: shellcheck --version

      - name: Check scripts and their tests
        run: |
          mapfile -t scripts < <(git ls-files \
            'skills/*/scripts/*.sh' 'evals/*.sh' \
            '.github/scripts/*.sh' '.github/scripts/*.bats' '.github/scripts/*.bash')
          if (( ${#scripts[@]} )); then
            shellcheck "${scripts[@]}"
          else
            echo "No scripts to check."
          fi

      - name: Check fenced shell blocks in Markdown
        run: |
          mapfile -t docs < <(git ls-files '*.md')
          .github/scripts/check-shell-blocks.py "${docs[@]}"

  tests:
    name: Test scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fakes stand in for gh, uv and skill-validator, so the tests make no
      # network calls. jq and shellcheck come with the runner image.
      - name: Install version parser
        run: python3 -m pip install PyYAML==6.0.3

      - name: Test version and release scripts
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py"

      - name: Run the .github/scripts tests
        run: npx --yes bats@1.13.0 .github/scripts/tests/

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the full history
        run: gitleaks git --no-banner --redact --verbose .

  workflows:
    name: Audit workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  versions:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install version parser
        run: python3 -m pip install PyYAML==6.0.3

      - name: Validate versions and changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/check-versions.py --base "$BASE_SHA"

  release:
    name: Release
    needs: [skills, scan, markdown, shell, tests, secrets, workflows, versions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: $/.github/workflows/release.yml
