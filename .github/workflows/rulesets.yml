# Report drift between .github/rulesets/*.json and the live rulesets.
#
# Not a required check. A pull request that changes a ruleset is applied by
# hand after it merges (see .github/rulesets/README.md), so this fails on
# main until then: that failure is the reminder to apply it. The weekly run
# catches changes made in GitHub's settings pages.

name: Rulesets

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Check rulesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare live rulesets with .github/rulesets
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/rulesets.sh check
