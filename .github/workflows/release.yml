# Called by CI after all checks pass on a main-branch commit.
# Manual dispatch rebuilds Pages from existing releases only.
name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Release bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install version parser
        run: python3 -m pip install PyYAML==6.0.3

      - name: Publish a bundle version increase
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/publish-release.py

  pages:
    name: Publish bundles
    concurrency:
      group: github-pages
      cancel-in-progress: false
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download every release's bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t tags < <(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 1000 --json tagName --jq '.[].tagName')
          if (( ${#tags[@]} == 0 )); then
            echo "::error::No releases to publish"
            exit 1
          fi
          for tag in "${tags[@]}"; do
            gh release download "$tag" --dir "site/${tag#v}" \
              --pattern bundle.zip --pattern bundle.zip.sha256
            (cd "site/${tag#v}" && sha256sum --check bundle.zip.sha256)
          done

      - name: Write the index
        run: .github/scripts/build-site.py site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
