# Fallback for repositories with no Vale config of their own:
#   vale --config ~/.config/vale/british.ini FILE.md
#
# British English (-ise) spelling plus the Generic vocabulary. Needs an
# -ise en_GB Hunspell dictionary (en_GB.aff, en_GB.dic) in
# styles/config/dictionaries/.
StylesPath = styles
Vocab = Generic

[*.md]
BasedOnStyles = Generic
# en_US; replaced by Generic.Spelling
Vale.Spelling = NO
